<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><style>text{font-family:Arial,sans-serif;fill:#142940}.t{font-size:32px;font-weight:700}.s{font-size:18px;fill:#526d86}.box{fill:#fff;stroke:#285d8c;stroke-width:2;rx:18}.bhead{fill:#174574;rx:16}.h{font-size:21px;font-weight:700;fill:#fff}.p{font-size:18px}.arrow{stroke:#33719a;stroke-width:4;fill:none;marker-end:url(#a)}.ok{fill:#087a59;font-weight:700;font-size:19px}.no{fill:#ba3434;font-weight:700;font-size:19px}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#33719a"/></marker></defs><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="72" class="t">Portfolio 3 — Transactions and Concurrency Controls</text><text x="70" y="106" class="s">Database constraints and atomic application operations protect academic records.</text><g transform="translate(90 225)"><rect class="box" width="300" height="300"/><rect class="bhead" width="300" height="54"/><text x="22" y="35" class="h">REGISTRATION</text><text x="22" y="94" class="p">Student submits course</text><text x="22" y="127" class="p">registration request</text><text x="22" y="178" class="no">✕ Duplicate blocked</text><text x="22" y="212" class="no">✕ Invalid course blocked</text><text x="22" y="260" class="ok">✓ Single transaction</text></g><g transform="translate(650 225)"><rect class="box" width="300" height="300"/><rect class="bhead" width="300" height="54"/><text x="22" y="35" class="h">GRADE ENTRY</text><text x="22" y="94" class="p">Lecturer saves scores</text><text x="22" y="127" class="p">for assigned offering</text><text x="22" y="178" class="no">✕ Score limit check</text><text x="22" y="212" class="no">✕ Wrong lecturer blocked</text><text x="22" y="260" class="ok">✓ Atomic save</text></g><g transform="translate(1210 225)"><rect class="box" width="300" height="300"/><rect class="bhead" width="300" height="54"/><text x="22" y="35" class="h">PUBLICATION</text><text x="22" y="94" class="p">Administrator approves</text><text x="22" y="127" class="p">submitted results</text><text x="22" y="178" class="no">✕ Draft not visible</text><text x="22" y="212" class="no">✕ Published is immutable</text><text x="22" y="260" class="ok">✓ Commit and audit</text></g><path class="arrow" d="M390 375H635"/><path class="arrow" d="M950 375H1195"/><rect x="245" y="665" width="1110" height="105" rx="22" fill="#e7f2fa" stroke="#8eb5d3" stroke-width="2"/><text x="300" y="712" class="p" style="font-weight:700">Database-level protection:</text><text x="300" y="748" class="p">unique constraints · foreign keys · triggers · transactions · role-scoped queries · published-result immutability</text></svg>
