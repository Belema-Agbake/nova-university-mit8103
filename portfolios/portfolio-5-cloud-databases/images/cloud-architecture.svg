<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><style>text{font-family:Arial,sans-serif;fill:#142940}.t{font-size:32px;font-weight:700}.s{font-size:18px;fill:#526d86}.box{fill:#fff;stroke:#285d8c;stroke-width:2;rx:18}.b{fill:#174574;rx:16}.g{fill:#087a78;rx:16}.o{fill:#ce6a29;rx:16}.h{font-size:20px;font-weight:700;fill:#fff}.p{font-size:18px}.small{font-size:16px;fill:#45647d}.arrow{stroke:#33719a;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#33719a"/></marker></defs><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="72" class="t">Portfolio 5 — Nova University Cloud Database Architecture</text><text x="70" y="106" class="s">Private Cloud SQL access, secret-managed credentials and scheduled event delivery.</text><g transform="translate(80 250)"><rect class="box" width="255" height="230"/><rect class="b" width="255" height="54"/><text x="20" y="35" class="h">USERS</text><text x="20" y="98" class="p">Students</text><text x="20" y="130" class="p">Lecturers</text><text x="20" y="162" class="p">Administrators</text></g><g transform="translate(430 250)"><rect class="box" width="285" height="230"/><rect class="b" width="285" height="54"/><text x="20" y="35" class="h">FIREBASE APP HOSTING</text><text x="20" y="98" class="p">Next.js portal</text><text x="20" y="130" class="p">Firebase Authentication</text><text x="20" y="162" class="small">Server-rendered APIs</text></g><g transform="translate(810 250)"><rect class="box" width="285" height="230"/><rect class="g" width="285" height="54"/><text x="20" y="35" class="h">VPC + SECRET MANAGER</text><text x="20" y="98" class="p">Private-ranges egress</text><text x="20" y="130" class="p">Database URL secret</text><text x="20" y="162" class="small">No public database port</text></g><g transform="translate(1190 250)"><rect class="box" width="310" height="230"/><rect class="o" width="310" height="54"/><text x="20" y="35" class="h">CLOUD SQL POSTGRESQL</text><text x="20" y="98" class="p">Private IP database</text><text x="20" y="130" class="p">HA, backup and PITR</text><text x="20" y="162" class="small">Prisma migrations</text></g><path class="arrow" d="M335 365H415"/><path class="arrow" d="M715 365H795"/><path class="arrow" d="M1095 365H1175"/><g transform="translate(440 650)"><rect class="box" width="300" height="135"/><rect class="g" width="300" height="48"/><text x="20" y="31" class="h">CLOUD SCHEDULER</text><text x="20" y="90" class="p">Minute-by-minute trigger</text><text x="20" y="116" class="small">OIDC authenticated</text></g><g transform="translate(900 650)"><rect class="box" width="300" height="135"/><rect class="b" width="300" height="48"/><text x="20" y="31" class="h">CLOUD RUN WORKER</text><text x="20" y="90" class="p">Processes event outbox</text><text x="20" y="116" class="small">Direct VPC egress</text></g><path class="arrow" d="M740 718H885"/><path class="arrow" d="M1050 650V510"/><text x="1080" y="600" class="small">private event processing</text></svg>
