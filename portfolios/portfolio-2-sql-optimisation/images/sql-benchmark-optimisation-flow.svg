<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><style>text{font-family:Arial,sans-serif;fill:#13263f}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#48647f}.box{fill:#fff;stroke:#2c608d;stroke-width:2;rx:18}.h{fill:#174574;rx:16}.ht{font-size:21px;font-weight:bold;fill:#fff}.p{font-size:18px}.arrow{stroke:#317096;stroke-width:5;fill:none;marker-end:url(#a)}.tag{font-size:16px;font-weight:bold;fill:#087a59}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#317096"/></marker></defs><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="72" class="title">Portfolio 2 — SQL Query Optimisation Evidence</text><text x="70" y="106" class="sub">Repeatable benchmark workflow using 10,000 students and EXPLAIN ANALYZE</text><g transform="translate(80 210)"><rect class="box" width="270" height="240"/><rect class="h" width="270" height="52"/><text x="22" y="34" class="ht">1. DATASET</text><text x="22" y="90" class="p">10,000 students</text><text x="22" y="122" class="p">40,000 registrations</text><text x="22" y="154" class="p">Courses, offerings,</text><text x="22" y="186" class="p">results and outbox data</text></g><g transform="translate(460 210)"><rect class="box" width="270" height="240"/><rect class="h" width="270" height="52"/><text x="22" y="34" class="ht">2. BASELINE</text><text x="22" y="90" class="p">Seven realistic queries</text><text x="22" y="122" class="p">EXPLAIN ANALYZE</text><text x="22" y="154" class="p">Capture buffers, scans</text><text x="22" y="186" class="p">and execution timings</text></g><g transform="translate(840 210)"><rect class="box" width="270" height="240"/><rect class="h" width="270" height="52"/><text x="22" y="34" class="ht">3. INDEX DESIGN</text><text x="22" y="90" class="p">Composite indexes for</text><text x="22" y="122" class="p">filter, join and sort</text><text x="22" y="154" class="p">Explain selectivity and</text><text x="22" y="186" class="p">maintenance trade-offs</text></g><g transform="translate(1220 210)"><rect class="box" width="270" height="240"/><rect class="h" width="270" height="52"/><text x="22" y="34" class="ht">4. REPORT</text><text x="22" y="90" class="p">11 measured runs</text><text x="22" y="122" class="p">Median and P95</text><text x="22" y="154" class="p">JSON + Markdown</text><text x="22" y="186" class="p">evidence saved</text></g><path class="arrow" d="M350 330H450"/><path class="arrow" d="M730 330H830"/><path class="arrow" d="M1110 330H1210"/><rect x="220" y="590" width="1160" height="170" rx="24" fill="#e5f3ec" stroke="#59a987" stroke-width="2"/><text x="270" y="650" class="title" style="font-size:25px">Measured query groups</text><text x="270" y="695" class="p">Registered courses · available offerings · lecturer classes · course roster · approval queue · published results · event outbox</text><text x="270" y="735" class="tag">Evidence records median / P95 milliseconds, plan nodes, buffer use and the applied index rationale.</text></svg>
