<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><style>text{font-family:Arial,sans-serif;fill:#142940}.t{font-size:32px;font-weight:700}.s{font-size:18px;fill:#526d86}.box{fill:#fff;stroke:#285d8c;stroke-width:2;rx:18}.blue{fill:#174574;rx:16}.teal{fill:#087a78;rx:16}.orange{fill:#d16a25;rx:16}.h{font-size:21px;font-weight:700;fill:#fff}.p{font-size:18px}.arrow{stroke:#33719a;stroke-width:5;fill:none;marker-end:url(#a)}.small{font-size:16px;fill:#45647d}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#33719a"/></marker></defs><rect width="1600" height="900" fill="#f6f9fc"/><text x="70" y="72" class="t">Portfolio 4 — PostgreSQL to Firestore Notification Model</text><text x="70" y="106" class="s">PostgreSQL remains the authoritative academic system; Firestore provides secure user-facing notification projections.</text><g transform="translate(80 260)"><rect class="box" width="285" height="250"/><rect class="blue" width="285" height="54"/><text x="22" y="35" class="h">POSTGRESQL</text><text x="22" y="96" class="p">Results, registration,</text><text x="22" y="129" class="p">users and approvals</text><text x="22" y="180" class="small">Authoritative relational data</text><text x="22" y="213" class="small">Transaction commits event</text></g><g transform="translate(490 260)"><rect class="box" width="285" height="250"/><rect class="orange" width="285" height="54"/><text x="22" y="35" class="h">ACADEMIC EVENT OUTBOX</text><text x="22" y="96" class="p">PENDING → PROCESSING</text><text x="22" y="129" class="p">→ DELIVERED / DEAD LETTER</text><text x="22" y="180" class="small">Retry and lease controls</text><text x="22" y="213" class="small">Idempotent event identity</text></g><g transform="translate(900 260)"><rect class="box" width="285" height="250"/><rect class="blue" width="285" height="54"/><text x="22" y="35" class="h">CLOUD RUN WORKER</text><text x="22" y="96" class="p">Claims one event</text><text x="22" y="129" class="p">Writes projections</text><text x="22" y="180" class="small">Private VPC database access</text><text x="22" y="213" class="small">Scheduler invoked</text></g><g transform="translate(1310 260)"><rect class="box" width="230" height="250"/><rect class="teal" width="230" height="54"/><text x="22" y="35" class="h">FIRESTORE</text><text x="22" y="96" class="p">Notifications</text><text x="22" y="129" class="p">Activity feed</text><text x="22" y="180" class="small">Per-user rules</text><text x="22" y="213" class="small">Client read / mark read</text></g><path class="arrow" d="M365 385H475"/><path class="arrow" d="M775 385H885"/><path class="arrow" d="M1185 385H1295"/><rect x="230" y="650" width="1140" height="100" rx="22" fill="#e5f3ec" stroke="#59a987" stroke-width="2"/><text x="280" y="694" class="p" style="font-weight:700">Reliability controls:</text><text x="280" y="728" class="p">five delivery attempts · exponential backoff · expired-lease recovery · concurrent-worker safe claims · Firestore emulator tests</text></svg>
