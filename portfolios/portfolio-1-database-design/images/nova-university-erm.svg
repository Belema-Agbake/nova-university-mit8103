<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Nova University Entity Relationship Model</title><desc id="desc">Core academic entities and relationships for the Nova University result portal.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#13263f}.t{font-size:27px;font-weight:700}.h{font-size:18px;font-weight:700;fill:#fff}.r{font-size:16px}.box{fill:#fff;stroke:#244b76;stroke-width:2;rx:12}.head{fill:#174574;rx:10}.line{stroke:#48749e;stroke-width:3;fill:none}.card{fill:#f6f9fc}.label{font-size:15px;fill:#42627f}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#48749e"/></marker></defs>
  <rect width="1600" height="980" class="card"/><text x="65" y="60" class="t">Nova University — Academic Database ERM</text><text x="65" y="92" class="label">Primary entities used for registration, grading, academic history and transcript generation</text>
